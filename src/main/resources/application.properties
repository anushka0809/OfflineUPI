# Server
server.port=${PORT:8080}
server.error.whitelabel.enabled=false
server.error.include-message=always

# ─── MySQL datasource ───────────────────────────────────────────────────────
# Railway injects individual vars: MYSQLHOST, MYSQLPORT, MYSQLUSER,
# MYSQLPASSWORD, MYSQLDATABASE — we compose the URL from those.
# The SPRING_DATASOURCE_URL override still works if you set it manually.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:offlineupi}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:password}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Connection pool — retry on startup so we survive MySQL being slow to ready
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=120000
spring.datasource.hikari.maximum-pool-size=5

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console disabled
spring.h2.console.enabled=false

# ─── JWT ────────────────────────────────────────────────────────────────────
offlineupi.app.jwtExpirationMs=86400000
offlineupi.app.jwtRefreshExpirationMs=604800000
offlineupi.app.jwtSecret=${OFFLINEUPI_APP_JWTSECRET:9a4f2c8d3b7a1e5c8f9d0a2b4c6e8f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e}
offlineupi.app.aesSecret=${OFFLINEUPI_APP_AESSECRET:OfflineUPIAESKey}

# ─── Cache — simple (in-memory) by default, no Redis needed ─────────────────
spring.cache.type=${SPRING_CACHE_TYPE:simple}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# ─── CORS — set APP_CORS_ALLOWED_ORIGINS on Railway after frontend deploys ──
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
 