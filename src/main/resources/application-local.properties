# ─── Local development profile (H2, no MySQL/Redis required) ───────────────
# Activate with:  mvn spring-boot:run -Dspring-boot.run.profiles=local
# or:             SPRING_PROFILES_ACTIVE=local mvn spring-boot:run
#
# This mirrors what the README documents (H2 in-memory DB) and lets you run
# the app with zero external services. The default application.properties
# still targets MySQL (for Docker / Railway) and is untouched.

spring.datasource.url=jdbc:h2:mem:offlineupi;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 web console for inspecting data at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Simple in-memory cache, no Redis needed locally
spring.cache.type=simple